version: 0.2

env:
  variables:
    ECR_REPOSITORY: blacklist-api

phases:
  install:
    runtime-versions:
      python: 3.12
  pre_build:
    commands:
      - echo "Instalando dependencias"
      - pip install -r requirements-dev.txt
      - ACCOUNT_ID=$(echo "$CODEBUILD_BUILD_ARN" | cut -d ':' -f 5)
      - REGISTRY="$ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com"
      - IMAGE_URI="$REGISTRY/$ECR_REPOSITORY"
      - IMAGE_TAG=$(echo "$CODEBUILD_RESOLVED_SOURCE_VERSION" | cut -c 1-7)
      - IMAGE_TAG=${IMAGE_TAG:-latest}
      - echo "Iniciando sesion en ECR $REGISTRY"
      - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "$REGISTRY"
  build:
    on-failure: ABORT
    commands:
      - echo "Ejecutando pruebas unitarias"
      - python -m pytest -v --junitxml=reports/pytest.xml
      - echo "Pruebas superadas, construyendo la imagen $IMAGE_URI:$IMAGE_TAG"
      - docker build -t "$IMAGE_URI:$IMAGE_TAG" -t "$IMAGE_URI:latest" .
  post_build:
    commands:
      - echo "Publicando la imagen en ECR"
      - docker push "$IMAGE_URI:$IMAGE_TAG"
      - docker push "$IMAGE_URI:latest"
      - printf '{"ImageURI":"%s"}' "$IMAGE_URI:$IMAGE_TAG" > imageDetail.json
      - cat imageDetail.json

reports:
  pytest-reports:
    files:
      - pytest.xml
    base-directory: reports
    file-format: JUNITXML

artifacts:
  files:
    - imageDetail.json
    - appspec.json
    - taskdef.json
